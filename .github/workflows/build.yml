name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Branch protection should require the check of every job here except the
# two with continue-on-error, clang and regress-pending, which report
# without gating. A matrix job gives one check per cell, with its name:
# line filled in, such as "x86_64 gcc 13 debug". Renaming a job renames its
# check, and branch protection then waits for a check that never comes.
jobs:
  # Every build mode on x86_64, with GCC 13 (the runner's gcc) and GCC 14.
  # Each cell builds the default target, then runs the suites, the gating
  # regress programs and the examples that check their own results. tiny
  # runs them too: the aarch64-cross job also builds tiny, with its linker
  # script, -Os and stripped section headers, but it cannot run what it
  # builds, and only running the binaries shows that they work. ubsan makes
  # every -fsanitize=undefined check a trap, so a program that hits
  # undefined behavior dies with SIGILL and its suite fails. Then
  # ci/elfcheck.sh checks the program headers of every binary the cell
  # built.
  x86_64:
    name: x86_64 gcc ${{ matrix.gcc }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
        mode: [debug, release, tiny, ubsan]
    env:
      CC: gcc-${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-${{ matrix.gcc }}
      - name: Build
        run: |
          "$CC" --version | head -n 1
          ./configure ${{ matrix.mode }}
          ninja
      # Ubuntu's AppArmor restricts unprivileged user namespaces by default,
      # and test_syscall then skips its tmpfs mount. Lift that so it runs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        run: ninja test
      # The programs of the fixed defects that tests/regress/manifest marks
      # gating. This also runs when a suite failed, so one run reports both.
      - name: Run regress programs
        if: ${{ !cancelled() }}
        run: ninja regress
      # The examples that check their own results, and lightio_test: a
      # failed check makes its program exit 1 (see examples/checks.h).
      # heap.example skips its heap_pages_reclaimed check in release and
      # tiny, which keep no heap statistics. This also runs when a step
      # above failed.
      - name: Run examples
        if: ${{ !cancelled() }}
        run: ninja smoke
      # Every ELF executable and shared object in build/, which by now holds
      # the default target, the suites and the regress programs: no RWX
      # header and a GNU_STACK RW header, and in an executable no PT_TLS
      # and no 4 KiB page that code and data share (see ci/elfcheck.sh).
      # This also runs when a step above failed, so a program that died at
      # its start because of its layout is explained here.
      - name: Check the program headers of every binary
        if: ${{ !cancelled() }}
        run: sh ci/elfcheck.sh build
      # When a fault or trap kills a program, as a ubsan trap does, the
      # summary says only "killed by signal N". The kernel logged where it
      # stopped: print that, with the source line in debug and ubsan builds.
      # A suite that timed out leaves no such report.
      - name: Show where crashed programs stopped
        if: ${{ failure() }}
        run: sudo dmesg | sh ci/crash-report.sh

  # debug and release on a native aarch64 runner. These are the aarch64
  # checks of record: they run every case on a real arm64 kernel.
  # aarch64-qemu stays beside them as a smoke lane, and its check is
  # required too. The runner's kernel has io_uring, user namespaces and
  # seccomp, so no case may skip. As on x86_64, LIGHTC_TEST_ALLOW_SKIP
  # stays unset, so a suite that skips every test fails, and the steps
  # below also fail on any single SKIP: line, but for the one check that
  # release builds skip (see Run examples).
  aarch64-native:
    name: aarch64 native ${{ matrix.mode }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc
      # What an aarch64 failure can depend on, so the log alone can explain
      # one: the kernel, the toolchain, the CPU and its features, the page
      # size, and whether io_uring and user namespaces are allowed.
      - name: Describe the runner
        run: |
          uname -a
          gcc --version | head -n 1
          ld --version | head -n 1
          echo "page size: $(getconf PAGESIZE)"
          lscpu
          for name in kernel.io_uring_disabled kernel.apparmor_restrict_unprivileged_userns debug.exception-trace; do
            sysctl "$name" || true
          done
      - name: Build
        run: |
          ./configure ${{ matrix.mode }}
          grep -qx 'arch = aarch64' build.ninja
          ninja
      # As on x86_64, so test_syscall's tmpfs mount case runs.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          ninja test 2>&1 | tee build/test.log
      # tests/run.sh fails only a suite that skips every test, so one case
      # that skips, such as test_syscall's tmpfs mount, would go unseen.
      # Print each SKIP: line with its suite, and fail on any. This also
      # runs when a suite failed, so one run reports both.
      - name: Check that no case skipped
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          awk '/^--- build\/test_[a-z0-9_]* ---$/ { suite = $2; sub(/^build\//, "", suite); next }
               /^[ \t]*SKIP:/ { sub(/^[ \t]*/, ""); print suite ": " $0; skips++ }
               END {
                   if (skips) { print "Cases skipped: " skips ". On this runner every case must run."; exit 1 }
                   print "No case skipped."
               }' build/test.log
      # As in the aarch64-qemu job: no gating regress program may skip.
      - name: Run regress programs
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ninja regress 2>&1 | tee build/regress.log
          if grep -E '^[[:space:]]*SKIP:' build/regress.log; then
            echo "A gating regress program skipped a test."
            exit 1
          fi
      # The examples that check their own results, and lightio_test. An
      # example prints a skipped check as "NAME SKIP: REASON", and this
      # fails on any such line but one: release keeps no heap statistics
      # (LC_STATS), so there heap.example skips heap_pages_reclaimed.
      - name: Run examples
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ninja smoke 2>&1 | tee build/smoke.log
          awk -v mode='${{ matrix.mode }}' '
              /^--- build\/[^ ]* ---$/ { prog = $2; sub(/^build\//, "", prog); next }
              /(^|[ \t])SKIP:/ {
                  if (mode == "release" && prog == "heap.example" && $1 == "heap_pages_reclaimed") {
                      print prog ": " $0 " (release has no LC_STATS)"
                      allowed++
                      next
                  }
                  print prog ": " $0
                  skips++
              }
              END {
                  if (skips) { print "Checks skipped: " skips ". On this runner every check must run."; exit 1 }
                  print (allowed ? "No other check skipped." : "No check skipped.")
              }' build/smoke.log
      # As on x86_64, but an executable's R E and RW PT_LOAD must not share
      # a 64 KiB page. On a 4 KiB page kernel, such as Ubuntu's arm64
      # kernel, a binary that breaks this still runs and passes its tests.
      # On a 16 or 64 KiB page kernel the RW mapping replaces the page it
      # shares with the code, and the program faults.
      - name: Check the program headers of every binary
        if: ${{ !cancelled() }}
        run: sh ci/elfcheck.sh build
      # On aarch64 the kernel logs the registers of a program a fault or
      # trap killed: this prints them, with the source line of pc and lr in
      # debug (release binaries are stripped, so there it prints ??).
      - name: Show where crashed programs stopped
        if: ${{ failure() }}
        run: sudo dmesg | sh ci/crash-report.sh

  # The pending ids in tests/regress/manifest are defects not fixed yet, so
  # their programs are expected to fail. This job prints each id with PASS or
  # FAIL and gates nothing: ninja regress-pending exits 0 either way. When a
  # pending program does not build, the job still lists every pending id and
  # then fails, and continue-on-error keeps the workflow green. A PASS says
  # the defect looks fixed: the PR with the fix marks its id gating, and
  # ninja regress runs it from then on.
  regress-pending:
    name: Pending regress programs (not gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc
      - name: Configure (debug)
        run: ./configure debug
      # As in the jobs that run ninja regress, so a pending program that
      # passes here also passes there once its id is gating.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # While a pending program does not build, ninja runs none of them;
      # -k 0 still builds the others, and pending.sh then lists every
      # pending id, one with no program as FAIL.
      - name: Run pending regress programs
        run: |
          ninja -k 0 regress-pending && exit 0
          sh tests/regress/pending.sh $(awk '{ sub(/#.*/, "") } $2 == "pending" { print "build/regress/" $1 }' tests/regress/manifest)
          exit 1
      # The pending regress programs are the only binaries this job links,
      # so with no pending id there is nothing to check, and elfcheck would
      # fail on a build/ with no binary.
      - name: Check the program headers of every binary
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(awk '{ sub(/#.*/, "") } $2 == "pending" { print $1 }' tests/regress/manifest)" ]; then
            echo "No pending regress programs, so no binary to check."
            exit 0
          fi
          sh ci/elfcheck.sh build

  # The aarch64 suites under qemu-user on an x86_64 runner: a smoke lane
  # beside the aarch64-native jobs, which are the aarch64 checks of record.
  # Its check is required too. It also pins the skips qemu-user causes, in
  # ci/qemu-skips.txt.
  aarch64-qemu:
    name: aarch64 under qemu-user (debug build + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu qemu-user-static binfmt-support
      # ninja test runs the aarch64 suites directly, so the kernel must hand
      # aarch64 ELF files to qemu-aarch64-static.
      - name: Check the aarch64 binfmt handler
        run: |
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-aarch64
      # configure takes the arch from CC and ar from CC's prefix, so CC alone
      # sets up the cross build. Debug, so lightc's safety checks run; the
      # aarch64-cross job builds release and tiny. This builds the default
      # target, as the other jobs do, and the suites, with the plugin
      # test_library loads.
      - name: Build (aarch64 debug)
        run: |
          CC=aarch64-linux-gnu-gcc ./configure debug
          grep -qx 'arch = aarch64' build.ninja
          ninja all tests
      # As in the x86_64 jobs, so the user namespace case skips only because
      # qemu-user cannot create one.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # ninja test (tests/run.sh) runs every suite, even after one fails, so a
      # single run shows every aarch64 failure. Each suite gets 120 s, so a
      # hung one fails and the summary names it, instead of the job's 15
      # minutes running out. qemu-user has no io_uring, so test_async and
      # test_lightio skip every test, which only this job allows: in the
      # x86_64 jobs that fails the run.
      - name: Run tests
        run: |
          set -o pipefail
          LIGHTC_TEST_ALLOW_SKIP="test_async test_lightio" ninja test 2>&1 | tee build/test.log
      # Cases qemu-user cannot run print SKIP: instead. Count the SKIP: lines
      # of each suite and fail unless the counts equal ci/qemu-skips.txt, so a
      # skip that appears or goes away fails the job. This also runs when a
      # suite failed, so one run reports both.
      - name: Compare skips with ci/qemu-skips.txt
        if: ${{ !cancelled() }}
        run: |
          suites=$(sed -n 's/^build tests: phony //p' build.ninja | wc -w)
          ran=$(grep -c '^--- build/test_[a-z0-9_]* ---$' build/test.log || true)
          echo "$ran of $suites suites ran"
          test "$ran" -eq "$suites"
          awk '/^--- build\/test_[a-z0-9_]* ---$/ { suite = $2; sub(/^build\//, "", suite); next }
               /^[ \t]*SKIP:/ { skips[suite]++ }
               END { for (s in skips) print s, skips[s] }' build/test.log | sort > build/skips.actual
          sed 's/#.*//' ci/qemu-skips.txt | awk 'NF && $2 != 0 { print $1, $2 }' | sort > build/skips.expected
          echo "SKIP: lines per suite in this run:"
          cat build/skips.actual
          if ! diff -u build/skips.expected build/skips.actual; then
            echo "The SKIP: counts differ from ci/qemu-skips.txt (-: the list, +: this run)."
            exit 1
          fi
      # The gating regress programs need nothing qemu-user lacks, so unlike
      # the suites none may skip: the step fails on any SKIP: line. Their
      # output stays out of build/test.log, whose SKIP: lines the step above
      # counts.
      - name: Run regress programs
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ninja regress 2>&1 | tee build/regress.log
          if grep -E '^[[:space:]]*SKIP:' build/regress.log; then
            echo "A gating regress program skipped a test under qemu-user."
            exit 1
          fi
      # The examples that check their own results, and lightio_test.
      # qemu-user has no io_uring, so async.example and lightio_test skip
      # every check, as test_async and test_lightio skip every test, and
      # only here LIGHTC_TEST_ALLOW_SKIP lets them. Every check of the other
      # programs must run and pass. This debug build keeps heap statistics,
      # so heap.example's heap_pages_reclaimed runs too, and the step fails
      # on a SKIP: line of any other program. The output goes to
      # build/smoke.log, so these skips are not counted against
      # ci/qemu-skips.txt.
      - name: Run examples
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          LIGHTC_TEST_ALLOW_SKIP="async.example lightio_test" ninja smoke 2>&1 | tee build/smoke.log
          awk '/^--- build\/[^ ]* ---$/ { prog = $2; sub(/^build\//, "", prog); next }
               /(^|[ \t])SKIP:/ && prog != "async.example" && prog != "lightio_test" { print prog ": " $0; skips++ }
               END {
                   if (skips) { print "Checks skipped: " skips ". Under qemu-user only the io_uring programs may skip."; exit 1 }
                   print "No program but async.example and lightio_test skipped a check."
               }' build/smoke.log
      # As in the aarch64-native job. The runner's x86_64 readelf reads
      # aarch64 binaries too.
      - name: Check the program headers of every binary
        if: ${{ !cancelled() }}
        run: sh ci/elfcheck.sh build

  aarch64-cross:
    name: aarch64 cross builds (release + tiny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc gcc-aarch64-linux-gnu
      # Ubuntu's own strip and objcopy handle only x86_64, so these links pass
      # only with the aarch64-linux-gnu- tools configure takes from CC's
      # prefix. Each mode builds the default target and the suites. Every
      # suite must then be an aarch64 binary with no symbol table, and in
      # tiny mode with no section headers, and every binary must pass
      # ci/elfcheck.sh. A mode that fails elfcheck fails the step only after
      # the other mode is built and checked too.
      - name: Build (aarch64 release and tiny)
        run: |
          elfcheck_failed=
          for mode in release tiny; do
            ./configure clean
            CC=aarch64-linux-gnu-gcc ./configure "$mode"
            grep -qx 'arch = aarch64' build.ninja
            ninja all tests
            for t in $(sed -n 's/^build tests: phony //p' build.ninja | sed 's/\$builddir/build/g'); do
              readelf -h "$t" | grep -q 'Machine: *AArch64$' || { echo "$t is not an aarch64 binary"; exit 1; }
              if [ "$mode" = tiny ]; then
                readelf -h "$t" | grep -q 'Number of section headers: *0$' || { echo "$t still has section headers"; exit 1; }
              elif readelf -S "$t" | grep -q '\.symtab'; then
                echo "$t is not stripped"
                exit 1
              fi
            done
            echo "$mode: every suite is a stripped aarch64 binary"
            sh ci/elfcheck.sh build || elfcheck_failed="$elfcheck_failed $mode"
          done
          if [ -n "$elfcheck_failed" ]; then
            echo "ci/elfcheck.sh failed in:$elfcheck_failed"
            exit 1
          fi
      # lightbox still configures lightc with ARCH set. ARCH must equal CC's
      # target arch: lightbox's line builds, and an ARCH that names another
      # arch stops configure.
      - name: Configure with ARCH, as lightbox does
        run: |
          ./configure clean
          ARCH=aarch64 CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar ./configure release
          ninja build/liblightc.a
          if ARCH=x86_64 CC=aarch64-linux-gnu-gcc ./configure release; then
            echo "configure accepted ARCH=x86_64 with an aarch64 compiler"
            exit 1
          fi
      # ci/elfcheck-test.sh links small x86_64 and aarch64 programs that
      # each break one rule of ci/elfcheck.sh, one of them with lightc
      # 0.1.0's ALIGN(4096) before .data, and checks that elfcheck fails
      # each on that rule alone and passes the good ones, among them a
      # shared object with PT_TLS. It runs whether or not a step above
      # failed.
      - name: Check that ci/elfcheck.sh catches bad binaries
        if: ${{ !cancelled() }}
        run: sh ci/elfcheck-test.sh gcc aarch64-linux-gnu-gcc

  abi-check:
    name: UAPI ABI check (x86_64 + aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc linux-libc-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      # abi_check.c checks every syscall number and errno value of
      # syscalls.def, through the headers generated from it and the lists
      # generated into it, every macro of the public headers and of
      # src/kernel.h that has a UAPI value, and the size and field offsets
      # of every struct lightc shares with the kernel. Each check also runs
      # when one above failed, so one run reports every failure.
      - name: Check x86_64
        run: gcc -std=c2x -ffreestanding -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only tests/abi_check.c
      - name: Check aarch64
        if: ${{ !cancelled() }}
        run: aarch64-linux-gnu-gcc -std=c2x -ffreestanding -Wall -Wextra -Wpedantic -Werror -Iinclude -fsyntax-only tests/abi_check.c
      # result.h must have every errno: the E* names and values each arch's
      # asm/errno.h defines must be exactly the errno lines of syscalls.def.
      - name: Check that syscalls.def lists every errno
        if: ${{ !cancelled() }}
        run: |
          awk '{ sub(/#.*/, "") } $1 == "errno" { print $2, $3 }' syscalls.def | sort > "$RUNNER_TEMP/errno.def"
          for cc in gcc aarch64-linux-gnu-gcc; do
            echo '#include <asm/errno.h>' | $cc -E -dM -x c - |
              awk '$1 == "#define" && $2 ~ /^E[A-Z0-9]+$/ { print $2, $3 }' | sort > "$RUNNER_TEMP/errno.uapi"
            if ! diff -u "$RUNNER_TEMP/errno.uapi" "$RUNNER_TEMP/errno.def"; then
              echo "$cc: the errnos of syscalls.def differ from asm/errno.h (-: asm/errno.h, +: syscalls.def)."
              exit 1
            fi
            echo "$cc: syscalls.def has the $(wc -l < "$RUNNER_TEMP/errno.def") errnos of asm/errno.h"
          done
      # The syscall_nr.h files, the errno lines of result.h and the lists in
      # abi_check.c are generated from syscalls.def and checked in. Run the
      # generator as a developer does: it must change no file, so a
      # syscalls.def edit committed without its regenerated files fails, and
      # so does a hand edit of a generated line. Here sh is dash and awk is
      # mawk, which also keeps the generator to POSIX sh and awk.
      - name: Check the files generated from syscalls.def
        if: ${{ !cancelled() }}
        run: |
          sh tools/gensyscalls.sh
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "These files differ from what tools/gensyscalls.sh generates from syscalls.def."
            echo "Run sh tools/gensyscalls.sh and commit the files it changes."
            exit 1
          fi
      # Each lc_syscallN(SYS_name, ...) call in the tree must have the N
      # that syscalls.def gives name, and each macro of the public headers
      # and of src/kernel.h must be in one of the lists of abi_check.c,
      # which check it or give the reason nothing can: see ci/abilint.sh.
      - name: Check lc_syscallN arities and that every macro is checked
        if: ${{ !cancelled() }}
        run: sh ci/abilint.sh
      # ci/abilint-test.sh plants wrong calls, unlisted macros and stale
      # list entries in copies of the tree, and checks that the lint fails
      # on each with the FAIL: lines expected, here under dash and mawk.
      - name: Check that ci/abilint.sh catches planted mistakes
        if: ${{ !cancelled() }}
        run: sh ci/abilint-test.sh

  pkg-config-consumer:
    name: pkg-config consumer (install + link)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc pkg-config
      - name: Configure (release)
        run: ./configure release
      # Installs into a temporary DESTDIR, then builds with only the installed
      # lightc.pc's flags: hello must be a static EXEC that passes
      # ci/elfcheck.sh, runs and exits 0, and a thread_local program must
      # fail to link.
      - name: Install and build consumers with pkg-config
        run: sh ci/consumer.sh

  # Each public header compiled alone, as C23 with -Wpedantic -Werror and
  # as C17: see ci/headers.sh, which finds the headers in the tree, so a new
  # one is checked too. gcc is GCC 13, which takes -std=c2x, gcc-14 takes
  # -std=c23, and with aarch64-linux-gnu-gcc <lightc/syscall.h> includes
  # the aarch64 syscall numbers. The headers use C23 [[attribute]] syntax,
  # which GCC 13 (gcc and aarch64-linux-gnu-gcc here) rejects in C17, so
  # gcc-14 and, in the clang job, clang check C17. Only headers are
  # compiled, so the warnings of files in src/ and examples/ cannot fail
  # this job.
  headers:
    name: Public headers (each alone, C23 + C17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-14 gcc-aarch64-linux-gnu
      - name: Compile each public header alone
        run: sh ci/headers.sh gcc gcc-14 aarch64-linux-gnu-gcc

  # lightc is written for GCC. This builds and tests it with the runner's
  # clang, to show where it does not build or pass, and gates nothing: the
  # check goes red, and continue-on-error keeps the workflow green. The
  # steps after the build also run when one before them failed, so one run
  # shows everything.
  clang:
    name: clang ${{ matrix.mode }} (not gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build
        run: |
          clang --version | head -n 1
          ./configure ${{ matrix.mode }}
          ninja
      - name: Allow unprivileged user namespaces
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        if: ${{ !cancelled() }}
        run: ninja test
      - name: Run regress programs
        if: ${{ !cancelled() }}
        run: ninja regress
      - name: Run examples
        if: ${{ !cancelled() }}
        run: ninja smoke
      - name: Check the program headers of every binary
        if: ${{ !cancelled() }}
        run: sh ci/elfcheck.sh build
      - name: Compile each public header alone
        if: ${{ !cancelled() && matrix.mode == 'debug' }}
        run: sh ci/headers.sh clang
